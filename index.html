      .bg-music-toggle {

        bottom: 24px;
        right: 24px;
        z-index: 999;
        width: 46px;
        height: 46px;
        border-radius: 50%;

      }
      .bg-music-toggle.is-playing svg {

        text-shadow: 0 1px 8px rgba(255, 255, 255, 0.75) !important;
        max-width: 480px;
        margin: 14px auto 0 !important;
        padding: 8px 18px !important;
        background: rgba(255, 252, 242, 0.65) !important;
        backdrop-filter: blur(8px) !important;

        border: 1px solid rgba(216, 154, 43, 0.4) !important;

      /* Keep the invitation panel clear of the couple's faces:
         the hero artwork scales with the viewport, so the offset is derived
         from viewport height/width to land just below the portrait.
         The second term caps it so the panel never reaches the bottom dock.
         First pass uses vh (fallback), second upgrades to dvh where supported. */
      .hero__note {
        margin-top: max(14px, min(calc(41.2vh - 197px), calc(78vh - 413px))) !important;
      }

      @media (min-width: 700px) {

  <body>
    <div id="root"></div>

    <!-- Background Music Audio & Toggle for Rote Gachey Khobor (Sarva Mangala) -->
    <audio id="bg-audio" loop preload="auto">
      <source src="./editable/assets/rote-gachey-khobor.mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" class="bg-music-toggle" aria-label="Toggle background music" style="display: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <script>
      (function() {
        const audio = document.getElementById('bg-audio');
        const toggleBtn = document.getElementById('music-toggle');
        let isStarted = false;

        audio.muted = false;

        // Sync with WEDDING_DATA music track if specified
        if (window.WEDDING_DATA && window.WEDDING_DATA.music && window.WEDDING_DATA.music.track) {
          const srcTag = audio.querySelector('source');
          if (srcTag && srcTag.getAttribute('src') !== window.WEDDING_DATA.music.track) {
            srcTag.src = window.WEDDING_DATA.music.track;
            audio.load();
          }
        }

        let initialSeekDone = false;

        window.startBgMusic = function() {
          const targetStartTime = (window.WEDDING_DATA && window.WEDDING_DATA.music && typeof window.WEDDING_DATA.music.startTime === 'number')
            ? window.WEDDING_DATA.music.startTime
            : 0;

          if (!isStarted) {
            isStarted = true;
            if (targetStartTime > 0) {
              try {
                audio.currentTime = targetStartTime;
                if (Math.abs(audio.currentTime - targetStartTime) < 1.0) {
                  initialSeekDone = true;
                }
              } catch (e) {}

              audio.addEventListener('loadedmetadata', function() {
                if (!initialSeekDone) {
                  audio.currentTime = targetStartTime;
                  initialSeekDone = true;
                }
              }, { once: true });
            } else {
              initialSeekDone = true;
            }
          }
          audio.muted = false;
          audio.play().then(() => {
            if (targetStartTime > 0 && !initialSeekDone && audio.currentTime < targetStartTime - 0.5) {
              audio.currentTime = targetStartTime;
              initialSeekDone = true;
            }
            toggleBtn.style.display = 'flex';
            toggleBtn.classList.add('is-playing');
          }).catch((err) => {
            console.log('Audio playback status:', err);
          });
        };

        // Start bg song after tapping "Tap to open" or user interaction
        document.addEventListener('pointerdown', function() {
          window.startBgMusic();
        }, { passive: true });

        document.addEventListener('click', function() {
          window.startBgMusic();
        }, { passive: true });

        toggleBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (audio.paused || audio.muted) {
            audio.muted = false;
            audio.play();
            toggleBtn.classList.add('is-playing');
          } else {
            audio.pause();
            toggleBtn.classList.remove('is-playing');
          }
        });
      })();
    </script>
