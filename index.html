    <style>
      /* Music controller button */
      .bg-music-toggle {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 999;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(30, 48, 12, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(245, 215, 130, 0.5);
        color: #fff9e7;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      }
      .bg-music-toggle:hover {
        transform: scale(1.08);
        border-color: rgba(245, 215, 130, 0.9);
        background: rgba(45, 68, 20, 0.95);
      }
      .bg-music-toggle.is-playing svg {
        animation: spin-record 5s linear infinite;
      }
      @keyframes spin-record {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Story quote, message, and milestone timeline */
      .story__quote {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic;
        font-size: 20px !important;
        line-height: 1.5 !important;
        color: #f7d57f !important;
        margin: 18px auto 14px !important;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
        max-width: 460px;
      }
      .story__message {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 17px !important;
        line-height: 1.65 !important;
        color: #fff4d9 !important;
        margin: 12px auto 20px !important;
        max-width: 460px;
      }
      .story__timeline {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 22px auto 24px;
        max-width: 450px;
        padding: 16px 18px;
        background: rgba(30, 48, 12, 0.65);
        border: 1px solid rgba(245, 215, 130, 0.3);
        border-radius: 14px;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }
      .story__milestone {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        border-bottom: 1px dashed rgba(245, 215, 130, 0.2);
        gap: 14px;
      }
      .story__milestone:last-child {
        border-bottom: none;
      }
      .milestone__label {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: #f7d57f;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .milestone__label i {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f7d57f;
        box-shadow: 0 0 6px #f7d57f;
      }
      .milestone__date {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 16px;
        font-style: italic;
        color: #fff9e7;
        font-weight: 500;
        white-space: nowrap;
      }
      .story__blessing {
        font-size: 15px !important;
        line-height: 1.65 !important;
        color: #e0d6c0 !important;
        margin-top: 18px !important;
        max-width: 460px;
      }
    </style>

  <body>
    <div id="root"></div>

    <!-- Background Music Audio & Toggle for Tenu Leke Main Jawanga -->
    <audio id="bg-audio" loop preload="auto">
      <source src="./editable/assets/tenu-leke.mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" class="bg-music-toggle" aria-label="Toggle background music" style="display: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <script>
      (function() {
        const audio = document.getElementById('bg-audio');
        const toggleBtn = document.getElementById('music-toggle');
        let isStarted = false;

        audio.muted = false;

        // Sync with WEDDING_DATA music track if specified
        if (window.WEDDING_DATA && window.WEDDING_DATA.music && window.WEDDING_DATA.music.track) {
          const srcTag = audio.querySelector('source');
          if (srcTag && srcTag.getAttribute('src') !== window.WEDDING_DATA.music.track) {
            srcTag.src = window.WEDDING_DATA.music.track;
            audio.load();
          }
        }

        window.startBgMusic = function() {
          if (!isStarted) {
            isStarted = true;
            // Start from 50s build-up leading into chorus "Tenu leke main jawanga"
            if (audio.currentTime < 10) {
              audio.currentTime = 50.0;
            }
          }
          audio.muted = false;
          audio.play().then(() => {
            toggleBtn.style.display = 'flex';
            toggleBtn.classList.add('is-playing');
          }).catch((err) => {
            console.log('Audio playback status:', err);
          });
        };

        // Start bg song after tapping "Tap to open" or user interaction
        document.addEventListener('pointerdown', function() {
          window.startBgMusic();
        }, { passive: true });

        document.addEventListener('click', function() {
          window.startBgMusic();
        }, { passive: true });

        toggleBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (audio.paused || audio.muted) {
            audio.muted = false;
            audio.play();
            toggleBtn.classList.add('is-playing');
          } else {
            audio.pause();
            toggleBtn.classList.remove('is-playing');
          }
        });
      })();
    </script>
  </body>
