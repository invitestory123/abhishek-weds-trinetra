    <style>
      /* Music controller button */
      .bg-music-toggle {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 999;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(30, 48, 12, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(245, 215, 130, 0.5);
        color: #fff9e7;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      }
      .bg-music-toggle:hover {
        transform: scale(1.08);
        border-color: rgba(245, 215, 130, 0.9);
        background: rgba(45, 68, 20, 0.95);
      }
      .bg-music-toggle.is-playing svg {
        animation: spin-record 5s linear infinite;
      }
      @keyframes spin-record {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Story quote, message, and milestone timeline */
      .story__quote {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic;
        font-size: 22px !important;
        line-height: 1.5 !important;
        color: #9a1843 !important; /* Deep romantic rose matching wedding theme */
        margin: 20px auto 14px !important;
        font-weight: 600 !important;
        text-shadow: none !important;
        max-width: 480px;
        text-align: center;
      }
      .story__message {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 19px !important;
        line-height: 1.7 !important;
        color: #1f2c0c !important; /* Rich deep forest ink, 100% visible on ivory */
        margin: 12px auto 22px !important;
        font-weight: 500 !important;
        max-width: 480px;
        text-align: center;
      }
      .story__timeline {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 24px auto 26px;
        max-width: 460px;
        padding: 16px 20px;
        background: linear-gradient(145deg, #243512, #1a270d) !important;
        border: 1px solid rgba(216, 154, 43, 0.45) !important;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(22, 34, 10, 0.22);
      }
      .story__milestone {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px dashed rgba(245, 215, 130, 0.25);
        gap: 14px;
      }
      .story__milestone:last-child {
        border-bottom: none;
      }
      .milestone__label {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: #fce38a !important; /* Crisp glowing warm gold */
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .milestone__label i {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fce38a;
        box-shadow: 0 0 6px #fce38a;
      }
      .milestone__date {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 17px;
        font-style: italic;
        color: #ffffff !important; /* Bright clear white */
        font-weight: 600;
        white-space: nowrap;
      }
      .story__blessing {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 18px !important;
        line-height: 1.7 !important;
        color: #2b3b13 !important; /* Deep forest ink, completely clear */
        margin: 20px auto 16px !important;
        font-weight: 500 !important;
        max-width: 480px;
        text-align: center;
      }
    </style>

  <body>
    <div id="root"></div>

    <!-- Background Music Audio & Toggle for Tenu Leke Main Jawanga -->
    <audio id="bg-audio" loop preload="auto">
      <source src="./editable/assets/tenu-leke.mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" class="bg-music-toggle" aria-label="Toggle background music" style="display: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <script>
      (function() {
        const audio = document.getElementById('bg-audio');
        const toggleBtn = document.getElementById('music-toggle');
        let isStarted = false;

        audio.muted = false;

        // Sync with WEDDING_DATA music track if specified
        if (window.WEDDING_DATA && window.WEDDING_DATA.music && window.WEDDING_DATA.music.track) {
          const srcTag = audio.querySelector('source');
          if (srcTag && srcTag.getAttribute('src') !== window.WEDDING_DATA.music.track) {
            srcTag.src = window.WEDDING_DATA.music.track;
            audio.load();
          }
        }

        window.startBgMusic = function() {
          if (!isStarted) {
            isStarted = true;
            // Start from 50s build-up leading into chorus "Tenu leke main jawanga"
            if (audio.currentTime < 10) {
              audio.currentTime = 50.0;
            }
          }
          audio.muted = false;
          audio.play().then(() => {
            toggleBtn.style.display = 'flex';
            toggleBtn.classList.add('is-playing');
          }).catch((err) => {
            console.log('Audio playback status:', err);
          });
        };

        // Start bg song after tapping "Tap to open" or user interaction
        document.addEventListener('pointerdown', function() {
          window.startBgMusic();
        }, { passive: true });

        document.addEventListener('click', function() {
          window.startBgMusic();
        }, { passive: true });

        toggleBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (audio.paused || audio.muted) {
            audio.muted = false;
            audio.play();
            toggleBtn.classList.add('is-playing');
          } else {
            audio.pause();
            toggleBtn.classList.remove('is-playing');
          }
        });
      })();
    </script>
  </body>
