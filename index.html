    <style>
      /* Music controller button */
      .bg-music-toggle {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 999;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(30, 48, 12, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(245, 215, 130, 0.5);
        color: #fff9e7;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      }
      .bg-music-toggle:hover {
        transform: scale(1.08);
        border-color: rgba(245, 215, 130, 0.9);
        background: rgba(45, 68, 20, 0.95);
      }
      .bg-music-toggle.is-playing svg {
        animation: spin-record 5s linear infinite;
      }
      @keyframes spin-record {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Music Audio & Toggle for Kudmayi ke din Aagaye -->
    <audio id="bg-audio" loop preload="auto">
      <source src="./editable/assets/kudmayi.mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" class="bg-music-toggle" aria-label="Toggle background music" style="display: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <script>
      (function() {
        const audio = document.getElementById('bg-audio');
        const toggleBtn = document.getElementById('music-toggle');
        let isStarted = false;

        function startBgMusic() {
          if (!isStarted) {
            isStarted = true;
            // Start from iconic verse 74s (Teri kudmayi ke din aa gaye)
            if (audio.currentTime < 10) {
              audio.currentTime = 74.0;
            }
            audio.play().then(() => {
              toggleBtn.style.display = 'flex';
              toggleBtn.classList.add('is-playing');
            }).catch(() => {
              // Browser autoplay policy might defer until user gesture
            });
          }
        }

        // Listen for video end or user tap to start continuous music
        document.addEventListener('pointerdown', function() {
          // If gate was opened, keep music available
          setTimeout(function() {
            const opening = document.querySelector('.opening');
            if (!opening || opening.classList.contains('is-playing')) {
              startBgMusic();
            }
          }, 800);
        }, { passive: true });

        toggleBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (audio.paused) {
            audio.play();
            toggleBtn.classList.add('is-playing');
          } else {
            audio.pause();
            toggleBtn.classList.remove('is-playing');
          }
        });
      })();
    </script>
  </body>
